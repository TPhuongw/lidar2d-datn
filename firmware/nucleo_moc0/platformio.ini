; nucleo_moc0: Nucleo-F411RE thay UNO (xung buoc + moc 0 do). Xem README.md.
[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_port = COM14
monitor_speed = 115200
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
build_src_flags = -Wall -Wextra
