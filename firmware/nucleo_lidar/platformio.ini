; nucleo_lidar: Nucleo-F411RE doc TF03, gan so buoc vao tung khung, goi nhi phan len PC. Xem README.md.
[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_port = COM14
monitor_speed = 460800
monitor_eol = LF
monitor_filters = send_on_enter
monitor_echo = yes
build_src_flags = -Wall -Wextra
