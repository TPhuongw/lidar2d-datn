<text x="66" y="822" font-size="23"><tspan font-weight="bold" fill="#8a6a00">Cột A (vàng) = nút D2:</tspan><tspan fill="#1b232c"> 3 thứ cắm chung 1 cột dọc nên tự nối với nhau: dây từ D2 + dây XANH LÁ + 1 chân điện trở 10k.</tspan></text>
<text x="66" y="866" font-size="23"><tspan font-weight="bold" fill="#8a6a00">Chân kia của 10k:</tspan><tspan fill="#1b232c"> cắm hàng + (5V). Nhờ vậy D2 bình thường ở mức cao; tia sáng lọt qua khe đĩa kéo nó xuống thấp.</tspan></text>
<text x="66" y="910" font-size="23"><tspan font-weight="bold" fill="#7a1f8f">Cột B (tím) = LED:</tspan><tspan fill="#1b232c"> dây TÍM + 1 chân điện trở 220 Ω; chân kia của 220 Ω cắm hàng + (5V).</tspan></text>
<text x="66" y="954" font-size="23"><tspan font-weight="bold" fill="#1c64c4">TRẮNG, XANH DƯƠNG:</tspan><tspan fill="#1b232c"> cắm thẳng hàng − (GND). Chân 5V và GND của UNO cắm vào hàng + và hàng −.</tspan></text>
