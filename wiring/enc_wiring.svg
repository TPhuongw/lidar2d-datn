<text x="390" y="639" text-anchor="end" font-size="26" font-weight="bold" fill="#fff">GND</text>
<text x="96" y="430" font-size="17" fill="#cfe3f5">D2: hàng DIGITAL, chân thứ 3</text>
<text x="96" y="454" font-size="17" fill="#cfe3f5">tính từ góc (sau D0, D1)</text>
<text x="96" y="610" font-size="17" fill="#cfe3f5">5V, GND: hàng POWER</text>
