<text x="1344" y="348" font-size="22" font-weight="bold" fill="#fff">1 TÍM</text>
<rect x="1308" y="547" width="26" height="26" rx="4" fill="#1c64c4"/>
<text x="1344" y="568" font-size="22" font-weight="bold" fill="#fff">4 XANH DƯƠNG</text>
<rect x="1308" y="587" width="26" height="26" rx="4" fill="#d0d0d0"/>
<text x="1344" y="608" font-size="22" font-weight="bold" fill="#fff">2 TRẮNG</text>
