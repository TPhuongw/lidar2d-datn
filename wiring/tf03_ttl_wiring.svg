<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#fff"/>
<text x="40" y="56" font-size="34" font-weight="bold" fill="#1b232c">Nối TF03 với module USB–TTL FT232RL</text>
<text x="40" y="94" font-size="22" fill="#5b6670">TX và RX nối chéo · jumper FT232 đặt 3,3 V · TF03 lấy 5 V từ UNO · tất cả chung GND</text>
<rect x="60" y="170" width="380" height="560" rx="16" fill="#b8323a"/>
<text x="250" y="222" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff">FT232RL</text>
<text x="250" y="252" text-anchor="middle" font-size="18" fill="#ffdfe0">(module USB–TTL) · cáp USB → PC</text>
<rect x="428" y="288" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/>
<text x="416" y="309" text-anchor="end" font-size="25" font-weight="bold" fill="#fff">GND</text>
<rect x="428" y="448" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/>
<text x="416" y="469" text-anchor="end" font-size="25" font-weight="bold" fill="#fff">RX</text>
<rect x="428" y="528" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/>
<text x="416" y="549" text-anchor="end" font-size="25" font-weight="bold" fill="#fff">TX</text>
<rect x="428" y="608" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/>
<text x="416" y="629" text-anchor="end" font-size="25" font-weight="bold" fill="#fff">VCC</text>
<text x="400" y="660" text-anchor="end" font-size="16" fill="#ffdfe0">VCC: để trống</text>
<rect x="100" y="360" width="160" height="64" rx="8" fill="#7a1f26"/>
<text x="180" y="387" text-anchor="middle" font-size="18" fill="#fff">Jumper</text><text x="180" y="412" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffe08a">3,3 V</text>
<text x="250" y="705" text-anchor="middle" font-size="16" fill="#ffdfe0">DTR, CTS: để trống</text>
<rect x="1140" y="170" width="400" height="560" rx="16" fill="#3a3f45"/>
<text x="1340" y="222" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff">TF03</text>
<text x="1340" y="252" text-anchor="middle" font-size="18" fill="#c9c9c9">UART LVTTL 3,3 V · nguồn 5–24 V</text>
<rect x="1128" y="288" width="24" height="24" fill="#222" stroke="#fff" stroke-width="2"/>
<text x="1164" y="309" font-size="23" font-weight="bold" fill="#fff">ĐEN  GND</text>
<rect x="1128" y="368" width="24" height="24" fill="#e03131" stroke="#fff" stroke-width="2"/>
<text x="1164" y="389" font-size="23" font-weight="bold" fill="#fff">ĐỎ  VCC</text>
<rect x="1128" y="448" width="24" height="24" fill="#8b5a2b" stroke="#fff" stroke-width="2"/>
<text x="1164" y="469" font-size="23" font-weight="bold" fill="#fff">NÂU  TX</text>
<rect x="1128" y="528" width="24" height="24" fill="#1c64c4" stroke="#fff" stroke-width="2"/>
<text x="1164" y="549" font-size="23" font-weight="bold" fill="#fff">XANH DƯƠNG  RX</text>
<rect x="1128" y="608" width="24" height="24" fill="#9aa3ab" stroke="#fff" stroke-width="2"/>
<text x="1164" y="629" font-size="23" font-weight="bold" fill="#fff">TRẮNG / XANH LÁ  CAN</text>
<text x="1340" y="668" text-anchor="middle" font-size="16" fill="#c9c9c9">dây CAN: để trống, bọc đầu dây</text>
<rect x="640" y="330" width="300" height="100" rx="12" fill="#1f6fb2"/>
<text x="760" y="372" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">Arduino UNO</text>
<text x="760" y="398" text-anchor="middle" font-size="16" fill="#cfe3f5">(chỉ lấy nguồn 5 V)</text>
<rect x="928" y="368" width="24" height="24" fill="#e03131" stroke="#fff" stroke-width="2"/>
<text x="916" y="389" text-anchor="end" font-size="20" font-weight="bold" fill="#fff">5V</text>
<rect x="858" y="318" width="24" height="24" fill="#222" stroke="#fff" stroke-width="2"/><text x="870" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">GND</text>
<path d="M452 300H1128" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M870 318V300" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="870" cy="300" r="9" fill="#222"/>
<path d="M952 380H1128" fill="none" stroke="#e03131" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M452 460H1128" fill="none" stroke="#2f9e44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M452 540H1128" fill="none" stroke="#1c64c4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560" y="290" font-size="20" font-weight="bold" fill="#222">GND chung (cả 3 thiết bị)</text>
<text x="1040" y="370" text-anchor="middle" font-size="20" font-weight="bold" fill="#e03131">5 V</text>
<text x="790" y="450" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f9e44">RX ← TX (dây nâu)</text>
<text x="790" y="530" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c64c4">TX → RX (dây xanh dương)</text>
<rect x="40" y="760" width="1520" height="116" rx="14" fill="#fff7d6" stroke="#f2b705" stroke-width="2"/>
<text x="64" y="796" font-size="21"><tspan font-weight="bold" fill="#8a6a00">Nối chéo:</tspan><tspan fill="#1b232c"> chân phát (TX) của bên này vào chân thu (RX) của bên kia.</tspan></text>
<text x="64" y="830" font-size="21"><tspan font-weight="bold" fill="#8a6a00">Jumper 3,3 V:</tspan><tspan fill="#1b232c"> tín hiệu từ FT232 vào RX của TF03 không vượt 3,3 V. Khi đó chân VCC của FT232 chỉ ra 3,3 V, không đủ cho TF03.</tspan></text>
<text x="64" y="864" font-size="21"><tspan font-weight="bold" fill="#8a6a00">Nguồn TF03:</tspan><tspan fill="#1b232c"> 5 V lấy từ UNO (hoặc nguồn 5–24 V bất kỳ), nhưng GND phải nối chung với FT232.</tspan></text>
</svg>