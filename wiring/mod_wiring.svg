<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="900" fill="#fff"/>
<text x="40" y="56" font-size="34" font-weight="bold" fill="#1b232c">Sơ đồ nối UNO với driver CL42C và module cảm biến khe LM393</text>
<text x="40" y="94" font-size="22" fill="#5b6670">Không còn breadboard, không còn điện trở: module có sẵn mọi thứ</text>
<rect x="560" y="150" width="400" height="560" rx="18" fill="#1f6fb2"/>
<text x="760" y="205" text-anchor="middle" font-size="32" font-weight="bold" fill="#fff">Arduino UNO</text>
<rect x="548" y="288" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="590" y="309" font-size="26" font-weight="bold" fill="#fff">D9</text>
<rect x="548" y="358" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="590" y="379" font-size="26" font-weight="bold" fill="#fff">D8</text>
<rect x="548" y="428" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="590" y="449" font-size="26" font-weight="bold" fill="#fff">GND</text>
<rect x="948" y="288" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="930" y="309" text-anchor="end" font-size="26" font-weight="bold" fill="#fff">5V</text>
<rect x="948" y="358" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="930" y="379" text-anchor="end" font-size="26" font-weight="bold" fill="#fff">GND</text>
<rect x="948" y="428" width="24" height="24" fill="#2b2b2b" stroke="#fff" stroke-width="3"/><text x="930" y="449" text-anchor="end" font-size="26" font-weight="bold" fill="#fff">D2</text>
<text x="760" y="560" text-anchor="middle" font-size="19" fill="#cfe3f5">D2: hàng DIGITAL, chân thứ 3 từ góc</text>
<text x="760" y="588" text-anchor="middle" font-size="19" fill="#cfe3f5">5V, GND: hàng POWER</text>
<rect x="60" y="200" width="300" height="360" rx="14" fill="#3a3f45"/>
<text x="210" y="248" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">Driver CL42C</text>
<text x="210" y="278" text-anchor="middle" font-size="18" fill="#c9c9c9">(jumper tín hiệu ở 5V)</text>
<rect x="348" y="288" width="24" height="24" fill="#2b2b2b" stroke="#ddd" stroke-width="2"/><text x="330" y="309" text-anchor="end" font-size="24" font-weight="bold" fill="#fff">PUL+</text>
<rect x="348" y="358" width="24" height="24" fill="#2b2b2b" stroke="#ddd" stroke-width="2"/><text x="330" y="379" text-anchor="end" font-size="24" font-weight="bold" fill="#fff">DIR+</text>
<rect x="348" y="428" width="24" height="24" fill="#2b2b2b" stroke="#ddd" stroke-width="2"/><text x="330" y="449" text-anchor="end" font-size="24" font-weight="bold" fill="#fff">PUL−</text>
<rect x="348" y="488" width="24" height="24" fill="#2b2b2b" stroke="#ddd" stroke-width="2"/><text x="330" y="509" text-anchor="end" font-size="24" font-weight="bold" fill="#fff">DIR−</text>
<path d="M372 300H548" fill="none" stroke="#f08c00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M372 370H548" fill="none" stroke="#2f9e44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M372 440H548" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M372 500H470V440" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="470" cy="440" r="8" fill="#222"/>
<text x="460" y="290" text-anchor="middle" font-size="18" fill="#5b6670">xung</text><text x="460" y="360" text-anchor="middle" font-size="18" fill="#5b6670">chiều</text>
<text x="60" y="610" font-size="20" fill="#5b6670">Phần driver giữ nguyên như hiện tại</text>
<text x="60" y="638" font-size="20" fill="#5b6670">(nguồn 24V, dây động cơ,</text><text x="60" y="664" font-size="20" fill="#5b6670">encoder động cơ)</text>
<rect x="1200" y="220" width="320" height="300" rx="14" fill="#1d4ea8"/>
<rect x="1360" y="250" width="130" height="100" rx="6" fill="#111"/><rect x="1405" y="250" width="40" height="70" fill="#1d4ea8"/>
<text x="1425" y="375" text-anchor="middle" font-size="18" fill="#cfd8f0">khe</text>
<text x="1360" y="490" text-anchor="middle" font-size="24" font-weight="bold" fill="#fff">Module khe LM393</text>

<rect x="1188" y="288" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/><text x="1228" y="309" font-size="24" font-weight="bold" fill="#fff">VCC</text>
<rect x="1188" y="358" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/><text x="1228" y="379" font-size="24" font-weight="bold" fill="#fff">GND</text>
<rect x="1188" y="428" width="24" height="24" fill="#c9a227" stroke="#fff" stroke-width="2"/><text x="1228" y="449" font-size="24" font-weight="bold" fill="#fff">DO</text>
<path d="M972 300H1188" fill="none" stroke="#e03131" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M972 370H1188" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M972 440H1188" fill="none" stroke="#f2b705" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1080" y="290" text-anchor="middle" font-size="18" fill="#5b6670">5V</text><text x="1080" y="360" text-anchor="middle" font-size="18" fill="#5b6670">GND</text><text x="1080" y="430" text-anchor="middle" font-size="18" fill="#5b6670">tín hiệu</text>
<text x="1360" y="560" text-anchor="middle" font-size="19" fill="#5b6670">Nếu module có chân thứ 4 (AO): để trống</text>
<rect x="40" y="740" width="1520" height="140" rx="14" fill="#fff7d6" stroke="#f2b705" stroke-width="2"/>
<text x="66" y="784" font-size="22"><tspan font-weight="bold" fill="#8a6a00">Đọc nhãn in trên module:</tspan><tspan fill="#1b232c"> thứ tự chân có thể khác ảnh này, nối theo CHỮ in trên mạch, không theo vị trí.</tspan></text>
<text x="66" y="824" font-size="22"><tspan font-weight="bold" fill="#8a6a00">Sau này chuyển sang STM32:</tspan><tspan fill="#1b232c"> VCC → 3,3V, DO → D3 (PB3). Không cấp 5V cho module khi dùng STM32.</tspan></text>
<text x="66" y="864" font-size="22"><tspan font-weight="bold" fill="#8a6a00">Code:</tspan><tspan fill="#1b232c"> encoder_only.ino / index_flag_test.ino dùng nguyên, D2 vẫn là chân tín hiệu.</tspan></text>
</svg>